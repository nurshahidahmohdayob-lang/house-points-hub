<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Join the Game</title>
  <meta name="description" content="Join your class's Live game and answer on your device." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #2a1d6b; --bg2: #6b4dff; --ink: #fff; --card: rgba(255,255,255,.12); --good: #22c55e; --bad: #ef4444; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: "Nunito", system-ui, sans-serif; color: var(--ink); background: radial-gradient(900px 600px at 50% -10%, var(--bg2), var(--bg)); min-height: 100dvh; display: flex; flex-direction: column; overflow-x: hidden; }
    h1, h2, .big { font-family: "Baloo 2", sans-serif; margin: 0; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 14px; text-align: center; }
    .logo { font-size: 3.5rem; animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    input { font: inherit; font-weight: 800; font-size: 1.6rem; text-align: center; border: 0; border-radius: 16px; padding: 14px; width: min(340px, 100%); color: #241c3d; }
    .code { letter-spacing: .4em; font-size: 2.2rem; }
    button { font: inherit; cursor: pointer; }
    .go { border: 0; border-radius: 16px; padding: 14px 26px; font-weight: 800; font-size: 1.3rem; background: #ffd23f; color: #3a2500; box-shadow: 0 6px 0 #c99a00; min-width: min(340px, 100%); }
    .go:active { transform: translateY(4px); box-shadow: 0 2px 0 #c99a00; }
    .go:disabled { opacity: .5; }
    .err { background: rgba(239,68,68,.25); padding: 8px 14px; border-radius: 12px; }
    .muted { opacity: .8; }
    .q { font-family: "Baloo 2"; font-size: clamp(1.3rem, 5vw, 2rem); line-height: 1.2; max-width: 700px; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: min(700px, 100%); }
    .tile { border: 0; border-radius: 20px; min-height: 110px; padding: 14px; color: #fff; font-weight: 800; font-size: clamp(1rem, 4vw, 1.3rem); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
    .tile i { font-style: normal; font-size: 1.8rem; }
    .tile:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .tile.picked { outline: 5px solid #fff; }
    .tile.dim { opacity: .35; }
    .result { font-size: 5rem; animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
    @keyframes pop { from { transform: scale(.3); opacity: 0; } }
    .pts { font-family: "Baloo 2"; font-size: 2rem; }
    .me { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 10px 16px; font-weight: 800; background: rgba(0,0,0,.18); }
    .bar { height: 10px; width: min(700px, 100%); background: rgba(255,255,255,.2); border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: #ffd23f; transition: width .9s linear; }
    .wait-dots span { display: inline-block; animation: bob 1.2s infinite; } .wait-dots span:nth-child(2) { animation-delay: .2s; } .wait-dots span:nth-child(3) { animation-delay: .4s; }
  </style>
</head>
<body>
  <div class="me" id="me" hidden><span id="meName"></span><span id="meScore"></span></div>
  <main id="app"></main>
  <script src="live-config.js"></script>
  <script src="live.js"></script>
  <script>
  (() => {
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const COLORS = ["#ef4444", "#3b82f6", "#f59e0b", "#22c55e", "#a855f7", "#14b8a6"];
    const SHAPES = ["▲", "◆", "●", "■", "★", "♥"];
    const app = $("#app");
    const params = new URLSearchParams(location.search);
    let code = (params.get("c") || "").replace(/\D/g, "").slice(0, 4);
    let me = null, st = null, timer = null, myStop = -1, myChoice = null, myResult = null, lastPhase = "";
    const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode */ } } };
    const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch { /* no vibration */ } };

    function askCode(msg) {
      app.innerHTML = `<div class="logo">🎮</div><h1>Join the game</h1><p class="muted">Type the code on the board</p>
        <input class="code" id="code" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(code)}" placeholder="0000" />
        ${msg ? `<p class="err">${esc(msg)}</p>` : ""}<button class="go" id="next">Next ›</button>`;
      const inp = $("#code"); inp.focus();
      const go = async () => {
        code = inp.value.replace(/\D/g, "").slice(0, 4);
        if (code.length !== 4) return askCode("The code has 4 numbers.");
        try { const s = await Live.state(code); if (!s) return askCode("No game with that code. Check the board!"); askName(); }
        catch { askCode("Can't reach the game. Check the internet."); }
      };
      $("#next").onclick = go; inp.onkeydown = (e) => { if (e.key === "Enter") go(); };
    }

    function askName(msg) {
      const saved = store.get("live-name") || "";
      app.innerHTML = `<div class="logo">🙋</div><h1>What's your name?</h1><p class="muted">Use your real name so your stars go to your jar ⭐</p>
        <input id="name" maxlength="30" autocomplete="given-name" value="${esc(saved)}" placeholder="Your name" />
        ${msg ? `<p class="err">${esc(msg)}</p>` : ""}<button class="go" id="join">Join! 🚀</button>`;
      const inp = $("#name"); inp.focus();
      const go = async () => {
        const name = inp.value.trim().replace(/\s+/g, " ");
        if (name.length < 2) return askName("Type your name first.");
        $("#join").disabled = true;
        try { await Live.join(code, name); me = name; store.set("live-name", name); store.set("live-" + code, name); $("#me").hidden = false; $("#meName").textContent = "🙂 " + name; poll(); }
        catch (e) { askName(e.message || "Couldn't join. Try again."); }
      };
      $("#join").onclick = go; inp.onkeydown = (e) => { if (e.key === "Enter") go(); };
    }

    async function poll() {
      try { st = await Live.state(code); } catch { /* keep the last screen */ }
      if (!st) { clearTimeout(timer); return askCode("The game has finished. Thanks for playing! 🎉"); }
      draw();
      timer = setTimeout(poll, Live.POLL_MS);
    }

    function draw() {
      const p = (st.players || []).find((x) => x.student === me);
      $("#meScore").textContent = p ? `⭐ ${p.score}` : "";
      const key = st.phase + ":" + st.stop;
      if (st.phase === "asking" && st.question) {
        if (myStop !== st.stop) { myStop = st.stop; myChoice = null; myResult = null; buzz(80); }
        if (myChoice !== null) { if (lastPhase !== key + ":locked") { lastPhase = key + ":locked"; locked(); } return; }
        if (lastPhase === key) { const b = $(".bar i"); if (b) b.style.width = left() + "%"; return; }
        lastPhase = key;
        const q = st.question;
        app.innerHTML = `<p class="muted">Question ${st.stop + 1} of ${st.stops}</p><div class="q">${esc(q.q)}</div><div class="bar"><i style="width:${left()}%"></i></div>
          <div class="tiles">${q.options.map((o, k) => `<button class="tile" data-k="${k}" style="background:${COLORS[k % 6]}"><i>${SHAPES[k % 6]}</i>${esc(o)}</button>`).join("")}</div>`;
        app.querySelectorAll(".tile").forEach((b) => b.onclick = async () => {
          if (myChoice !== null) return;
          myChoice = q.options[+b.dataset.k]; b.classList.add("picked"); buzz(30);
          app.querySelectorAll(".tile").forEach((x) => x !== b && x.classList.add("dim"));
          try { myResult = await Live.submit(code, me, st.stop, myChoice); } catch { myResult = null; }
          lastPhase = ""; draw();
        });
      } else if (st.phase === "reveal") {
        if (lastPhase === key) return; lastPhase = key;
        const right = myChoice !== null && st.answer && myChoice.trim().toLowerCase() === st.answer.trim().toLowerCase();
        if (myChoice === null) app.innerHTML = `<div class="result">⏰</div><h2>Too slow this time!</h2><p>The answer was <b>${esc(st.answer || "")}</b></p>`;
        else if (right) { app.innerHTML = `<div class="result">🎉</div><h2>Correct!</h2><div class="pts">+${myResult?.points ?? ""} ⭐</div>`; buzz([60, 40, 60]); }
        else app.innerHTML = `<div class="result">💪</div><h2>Not quite!</h2><p>The answer was <b>${esc(st.answer || "")}</b></p>`;
      } else if (st.phase === "end") {
        if (lastPhase === key) return; lastPhase = key;
        const ranked = [...st.players].sort((a, b) => b.score - a.score), rank = ranked.findIndex((x) => x.student === me) + 1;
        app.innerHTML = `<div class="result">${rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : "🌟"}</div><h1>${rank ? `You came #${rank}!` : "Game over!"}</h1><div class="pts">${p ? p.score : 0} points</div><p class="muted">Great playing!</p>`;
      } else {
        if (lastPhase === "lobby") return; lastPhase = "lobby";
        app.innerHTML = `<div class="logo">✅</div><h1>You're in, ${esc(me.split(" ")[0])}!</h1><p class="muted">Look at the board. The game starts soon<span class="wait-dots"><span>.</span><span>.</span><span>.</span></span></p>`;
      }
    }
    function locked() { app.innerHTML = `<div class="logo">🔒</div><h2>Answer locked in!</h2><p class="muted">Wait for the board<span class="wait-dots"><span>.</span><span>.</span><span>.</span></span></p>`; }
    function left() {
      if (!st.askedAt || !st.now) return 100;
      const gone = (Date.parse(st.now) - Date.parse(st.askedAt)) / 1000;
      return Math.max(0, Math.min(100, 100 - (gone / st.seconds) * 100));
    }

    if (code.length === 4) {
      const again = store.get("live-" + code);
      if (again) { me = again; $("#me").hidden = false; $("#meName").textContent = "🙂 " + me; Live.join(code, me).catch(() => {}).finally(poll); }
      else askName();
    } else askCode();
  })();
  </script>
</body>
</html>
